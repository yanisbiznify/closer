<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Biznify</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=15">
</head>
<body>
<div class="auth">
  <div class="auth-art">
    <div class="wm" style="display:flex;align-items:center;gap:10px"><img src="/brand/biznify-logo.svg" alt="Biznify" style="height:29px"></div>
    <div class="auth-line" aria-hidden="true"></div>
    <div class="copy">
      <h1>Ton business, au même endroit.</h1>
      <p>Appels, prospects, rendez-vous, automatisations et factures : tout Biznify dans une seule app.</p>
    </div>
  </div>
  <div class="auth-form">
    <form id="f">
      <h2>Connexion</h2>
      <p class="muted">Entre ton mot de passe pour accéder à Biznify.</p>
      <div class="field"><label for="pw">Mot de passe</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
      <button class="btn primary lg" style="width:100%" id="go">Se connecter</button>
      <div id="err" class="small c-bad" style="margin-top:12px;min-height:18px" role="alert"></div>
    </form>
  </div>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"); btn.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Connexion impossible");
    location.href = "/";
  } catch (err) { document.getElementById("err").textContent = err.message; btn.disabled = false; }
});
</script>
</body>
</html>
